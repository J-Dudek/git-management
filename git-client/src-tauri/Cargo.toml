[package]
name = "merathon"
version = "2.15.0"
description = "Merathon — Git Repository Manager : client Git graphique de bureau"
authors = ["Julien Dudek"]
license = "MIT"
repository = "https://github.com/J-Dudek/merathon"
homepage = "https://github.com/J-Dudek/merathon"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "merathon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Notifications système (activité des PR / MR quand la fenêtre est en arrière-plan).
tauri-plugin-notification = "~2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", features = ["https", "ssh"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
ureq = { version = "2", features = ["json"] }
# TLS des appels aux forges : autorités du système (certificats d'entreprise) en plus de celles de Mozilla.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Création et lecture des clés SSH (voir src/ssh_setup.rs). Sans `std` ni les fonctionnalités par défaut : elles feraient
# entrer dans Cargo.lock, même sans les compiler, crypto-bigint (RUSTSEC-2026-0387) et rsa (RUSTSEC-2023-0071).
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "encryption", "getrandom"] }

[dev-dependencies]
tempfile = "3"

# Notifications Linux par une connexion D-Bus gardée ouverte (voir src/notifications.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Sous WSL, notification Windows par `powershell.exe -EncodedCommand` (voir src/notifications.rs).
base64 = "0.22"

# Bureau seulement : mises à jour automatiques, redémarrage, trousseau du système et terminal intégré.
# Sur Android et iOS, il n'y a ni shell, ni trousseau, ni mises à jour hors du store.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Mises à jour automatiques (téléchargement signé depuis les releases GitHub) et redémarrage.
# Sans la fonctionnalité `zip` : les releases publient les paquets bruts (AppImage, deb, exe, msi),
# jamais d'archive .zip / .tar.gz ; elle n'apportait que la crate zip 4.x (RUSTSEC-2026-0367/0368/0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
portable-pty = "0.9"

# Android : OpenSSL (utilisé par libgit2 pour HTTPS et libssh2) n'existe pas sur le système ; il est compilé avec le projet.
# Demande perl et make sur la machine de build.
[target.'cfg(target_os = "android")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
