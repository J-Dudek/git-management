name: Release

# À chaque merge sur main :
#   1. tests (workflow CI) ;
#   2. calcul de la version d'après les commits depuis le dernier tag (Conventional Commits),
#      mise à jour des fichiers applicatifs, commit sur main et tag vX.Y.Z ;
#   3. génération des paquets Linux / Windows dans une release GitHub ;
#   4. publication de la release, une fois tous les paquets générés.
# Si les commits ne justifient pas de release (docs, ci, test, chore, style), on s'arrête après les tests.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule release à la fois, sans annuler celle en cours.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    # Le commit de version poussé par ce workflow ne relance pas de release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ci.yml

  version:
    name: Version et tag
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags complets pour calculer la version
          # main est protégée (ruleset) : le push du commit de version passe par un token
          # autorisé à la contourner (secret RELEASE_TOKEN). À défaut, GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prochaine version
        id: next
        working-directory: git-client
        run: |
          VERSION="$(node scripts/version.mjs next)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "Nouvelle version : $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun changement applicatif depuis la dernière release : pas de nouvelle version." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mise à jour des fichiers, commit et tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          node git-client/scripts/version.mjs apply "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add git-client/package.json git-client/package-lock.json \
            git-client/src-tauri/Cargo.toml git-client/src-tauri/Cargo.lock \
            git-client/src-tauri/tauri.conf.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "J6N v$VERSION"
          # Commit et tag poussés ensemble : soit les deux, soit aucun.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$VERSION"

  build:
    name: Paquets ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            targets: deb,appimage
          - platform: windows
            os: windows-latest
            targets: nsis,msi

    runs-on: ${{ matrix.os }}
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }} # le commit de version, avec les fichiers à jour

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libgit2-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        working-directory: git-client
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identifiants client OAuth intégrés au binaire (publics : variables ou secrets du dépôt)
          GIT_CLIENT_GITHUB_CLIENT_ID: ${{ vars.GIT_CLIENT_GITHUB_CLIENT_ID || secrets.GIT_CLIENT_GITHUB_CLIENT_ID }}
          GIT_CLIENT_GITLAB_CLIENT_ID: ${{ vars.GIT_CLIENT_GITLAB_CLIENT_ID || secrets.GIT_CLIENT_GITLAB_CLIENT_ID }}
        with:
          projectPath: git-client
          tagName: ${{ env.TAG }}
          releaseName: "J6N ${{ env.TAG }}"
          releaseBody: |
            ## J6N — Git Repository Manager ${{ env.TAG }}

            ### Téléchargements
            - **Linux** : `.deb` (Debian/Ubuntu) · `.AppImage` (universel)
            - **Windows** : `.msi` (installateur) · `.exe` (NSIS)

            ### Windows : avertissement SmartScreen
            Les installateurs ne sont pas encore signés : au premier lancement, Windows affiche
            « Windows a protégé votre ordinateur ». Cliquez sur **Informations complémentaires**,
            puis sur **Exécuter quand même**.

            ### Vérifier un téléchargement
            Les empreintes SHA-256 de tous les fichiers sont dans `SHA256SUMS.txt` :
            - Linux : `sha256sum -c SHA256SUMS.txt --ignore-missing`
            - Windows (PowerShell) : `Get-FileHash .\<fichier>` puis comparer avec la ligne correspondante
          # Brouillon pendant la génération : publié par le job suivant quand tous les paquets sont prêts.
          releaseDraft: true
          # latest.json (manifeste des mises à jour automatiques) : entrée Windows générique sur l'installateur NSIS.
          updaterJsonPreferNsis: true
          prerelease: false
          args: --bundles ${{ matrix.targets }}

  publish:
    name: Publication de la release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      # Empreintes de tous les paquets, pour que les utilisateurs puissent vérifier leurs téléchargements.
      - name: Empreintes SHA-256
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS.txt # en cas de relance : pas d'empreinte de l'ancien fichier
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publier la release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Release $TAG publiée : https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
