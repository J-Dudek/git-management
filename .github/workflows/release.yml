name: Release

# À chaque merge sur main :
#   1. en parallèle : les tests (workflow CI) et, si les commits justifient une release, la génération
#      des paquets Linux / Windows avec la nouvelle version appliquée (rien n'est encore publié) ;
#   2. seulement si tests et paquets réussissent : mise à jour des fichiers et du CHANGELOG.md, commit sur
#      main, tag vX.Y.Z et brouillon de release avec les paquets ;
#   3. publication de la release, puis copie sur le dépôt public (vitrine) : c'est lui qui sert les
#      téléchargements et les mises à jour automatiques.
# Les paquets sont générés avant le commit de version, à partir du même contenu : le job « Version, tag
# et brouillon » vérifie que les fichiers versionnés sont identiques à ceux des paquets.
# Si les commits ne justifient pas de release (docs, ci, test, chore, style), seuls les tests tournent.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule release à la fois, sans annuler celle en cours.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Dépôt public (vitrine) : ce dépôt-ci est privé, ses releases ne sont pas téléchargeables.
  PUBLIC_REPO: J-Dudek/merathon

jobs:
  tests:
    # Le commit de version poussé par ce workflow ne relance pas de release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ci.yml

  plan:
    name: Prochaine version
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historique et tags complets pour calculer la version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prochaine version
        id: next
        working-directory: git-client
        run: |
          VERSION="$(node scripts/version.mjs next)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "Nouvelle version : $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun changement applicatif depuis la dernière release : pas de nouvelle version." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Paquets générés pendant les tests, à partir du commit fusionné et de la version appliquée localement :
  # le même contenu que le futur commit de version. Ils ne sont publiés qu'une fois les tests passés.
  build:
    name: Paquets ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04 # glibc 2.35 : le binaire tourne sur Ubuntu 22.04+ et Debian 12+
            bundles: deb,appimage
          - platform: windows
            os: windows-latest
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libgit2-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        working-directory: git-client
        run: npm ci

      # Empreinte (arbre git) des fichiers versionnés : le job de release la compare à son commit de version.
      - name: Appliquer la version
        run: |
          node git-client/scripts/version.mjs apply "$VERSION"
          git add -- $VERSIONED_FILES
          mkdir -p dist
          git write-tree > dist/version-tree.txt
          echo "Arbre versionné : $(cat dist/version-tree.txt)"
        env:
          VERSIONED_FILES: >-
            git-client/package.json git-client/package-lock.json git-client/src-tauri/Cargo.toml
            git-client/src-tauri/Cargo.lock git-client/src-tauri/tauri.conf.json

      - name: Build
        working-directory: git-client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identifiants client OAuth intégrés au binaire (publics : variables ou secrets du dépôt)
          # (les anciens noms GIT_CLIENT_* des variables du dépôt restent lus)
          MERATHON_GITHUB_CLIENT_ID: ${{ vars.MERATHON_GITHUB_CLIENT_ID || secrets.MERATHON_GITHUB_CLIENT_ID || vars.GIT_CLIENT_GITHUB_CLIENT_ID || secrets.GIT_CLIENT_GITHUB_CLIENT_ID }}
          MERATHON_GITLAB_CLIENT_ID: ${{ vars.MERATHON_GITLAB_CLIENT_ID || secrets.MERATHON_GITLAB_CLIENT_ID || vars.GIT_CLIENT_GITLAB_CLIENT_ID || secrets.GIT_CLIENT_GITLAB_CLIENT_ID }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # Paquets et signatures (.sig, lues pour latest.json), sous leurs noms de release.
      - name: Rassembler les paquets
        run: |
          shopt -s nullglob
          bundle=git-client/src-tauri/target/release/bundle
          cp $bundle/deb/*.deb* $bundle/appimage/*.AppImage* $bundle/nsis/*.exe* $bundle/msi/*.msi* dist/
          ls -l dist

      - name: Conserver les paquets
        uses: actions/upload-artifact@v6
        with:
          name: paquets-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Version, tag et brouillon
    needs: [tests, plan, build]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags complets pour le changelog
          # main est protégée (ruleset) : le push du commit de version passe par un token
          # autorisé à la contourner (secret RELEASE_TOKEN). À défaut, GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Télécharger les paquets
        uses: actions/download-artifact@v7
        with:
          pattern: paquets-*
          path: paquets

      - name: Mise à jour des fichiers et du changelog, commit et tag
        id: release
        env:
          PUBLIC_REPOSITORY: ${{ env.PUBLIC_REPO }} # liens du changelog vers le dépôt public
          VERSIONED_FILES: >-
            git-client/package.json git-client/package-lock.json git-client/src-tauri/Cargo.toml
            git-client/src-tauri/Cargo.lock git-client/src-tauri/tauri.conf.json
        run: |
          node git-client/scripts/version.mjs apply "$VERSION"
          git add -- $VERSIONED_FILES
          # Les paquets doivent avoir été générés à partir exactement de ces fichiers.
          tree="$(git write-tree)"
          for f in paquets/*/version-tree.txt; do
            if [ "$(cat "$f")" != "$tree" ]; then
              echo "::error::Paquets générés avec d'autres fichiers versionnés ($f : $(cat "$f"), attendu $tree)"
              exit 1
            fi
          done
          # Section ajoutée en tête de CHANGELOG.md ; ses notes deviennent le corps de la release.
          {
            echo "changelog<<CHANGELOG_EOF"
            node git-client/scripts/version.mjs changelog "$VERSION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "$TAG" -m "Merathon $TAG"
          # Commit et tag poussés ensemble : soit les deux, soit aucun. Refusé si main a avancé entre-temps.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

      - name: Brouillon de release avec les paquets
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
        run: |
          {
            echo "## Merathon — Git Repository Manager $TAG"
            echo
            echo "$CHANGELOG"
            echo
            cat .github/release-footer.md
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Merathon $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            paquets/*/Merathon_* --clobber

  # Contenu du tag et tag lui-même copiés sur le dépôt public, avant d'y créer la release.
  public:
    name: Dépôt public
    needs: [plan, release]
    uses: ./.github/workflows/publish-public.yml
    with:
      tag: v${{ needs.plan.outputs.version }}
    secrets: inherit

  publish:
    name: Publication de la release
    needs: [plan, release, public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - name: Télécharger les paquets
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          # En cas de relance : fichiers régénérés ci-dessous.
          rm -f assets/SHA256SUMS.txt assets/latest.json

      # Manifeste des mises à jour automatiques, d'après les signatures de tous les paquets.
      # Entrées génériques : AppImage sous Linux, installateur NSIS sous Windows.
      - name: Manifeste des mises à jour (latest.json)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          BASE="https://github.com/$PUBLIC_REPO/releases/download/$TAG"
          platforms='{}'
          add() { # add <plateforme> <fichier> : échoue si le paquet ou sa signature manque
            [ -f "assets/$2" ] && [ -f "assets/$2.sig" ] || { echo "::error::Paquet ou signature manquant : $2"; exit 1; }
            platforms="$(jq --arg p "$1" --arg url "$BASE/$2" --rawfile sig "assets/$2.sig" \
              '.[$p] = {signature: $sig, url: $url}' <<< "$platforms")"
          }
          add linux-x86_64          "Merathon_${VERSION}_amd64.AppImage"
          add linux-x86_64-appimage "Merathon_${VERSION}_amd64.AppImage"
          add linux-x86_64-deb      "Merathon_${VERSION}_amd64.deb"
          add windows-x86_64        "Merathon_${VERSION}_x64-setup.exe"
          add windows-x86_64-nsis   "Merathon_${VERSION}_x64-setup.exe"
          add windows-x86_64-msi    "Merathon_${VERSION}_x64_en-US.msi"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          jq -n --arg version "$VERSION" --rawfile notes notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date, platforms: $platforms}' > assets/latest.json
          cat assets/latest.json
          gh release upload "$TAG" assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber

      # Empreintes de tous les paquets, pour que les utilisateurs puissent vérifier leurs téléchargements.
      - name: Empreintes SHA-256
        run: |
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publier la release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Mêmes notes et mêmes fichiers sur le dépôt public : latest.json y est lu par l'application.
      # Le tag y a été poussé par le job « Dépôt public » (d'où --verify-tag).
      - name: Release sur le dépôt public
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # En cas de relance : la release existe déjà, seuls ses fichiers sont remplacés.
          if ! gh release view "$TAG" --repo "$PUBLIC_REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$PUBLIC_REPO" --draft --verify-tag \
              --title "Merathon $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" assets/* SHA256SUMS.txt --repo "$PUBLIC_REPO" --clobber
          gh release edit "$TAG" --repo "$PUBLIC_REPO" --draft=false --latest
          echo "Release $TAG publiée : https://github.com/$PUBLIC_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
