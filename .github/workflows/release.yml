name: Release

# À chaque merge sur main :
#   1. tests (workflow CI) ;
#   2. calcul de la version d'après les commits depuis le dernier tag (Conventional Commits),
#      mise à jour des fichiers applicatifs et du CHANGELOG.md, commit sur main et tag vX.Y.Z ;
#   3. génération des paquets Linux / Windows dans une release GitHub ;
#   4. publication de la release, une fois tous les paquets générés.
# Si les commits ne justifient pas de release (docs, ci, test, chore, style), on s'arrête après les tests.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule release à la fois, sans annuler celle en cours.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    # Le commit de version poussé par ce workflow ne relance pas de release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ci.yml

  version:
    name: Version et tag
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags complets pour calculer la version
          # main est protégée (ruleset) : le push du commit de version passe par un token
          # autorisé à la contourner (secret RELEASE_TOKEN). À défaut, GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prochaine version
        id: next
        working-directory: git-client
        run: |
          VERSION="$(node scripts/version.mjs next)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "Nouvelle version : $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun changement applicatif depuis la dernière release : pas de nouvelle version." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mise à jour des fichiers et du changelog, commit et tag
        id: release
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          node git-client/scripts/version.mjs apply "$VERSION"
          # Section ajoutée en tête de CHANGELOG.md ; ses notes deviennent le corps de la release.
          {
            echo "changelog<<CHANGELOG_EOF"
            node git-client/scripts/version.mjs changelog "$VERSION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add git-client/package.json git-client/package-lock.json \
            git-client/src-tauri/Cargo.toml git-client/src-tauri/Cargo.lock \
            git-client/src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Merathon v$VERSION"
          # Commit et tag poussés ensemble : soit les deux, soit aucun.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$VERSION"

      # Brouillon créé ici, une seule fois : si chaque job de paquets créait le sien en parallèle,
      # on obtiendrait deux brouillons pour le même tag, chacun avec la moitié des paquets.
      - name: Brouillon de release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.next.outputs.version }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
        run: |
          {
            echo "## Merathon — Git Repository Manager $TAG"
            echo
            echo "$CHANGELOG"
            echo
            cat .github/release-footer.md
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Merathon $TAG" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Paquets ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            targets: deb,appimage
          - platform: windows
            os: windows-latest
            targets: nsis,msi

    runs-on: ${{ matrix.os }}
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }} # le commit de version, avec les fichiers à jour

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libgit2-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        working-directory: git-client
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identifiants client OAuth intégrés au binaire (publics : variables ou secrets du dépôt)
          GIT_CLIENT_GITHUB_CLIENT_ID: ${{ vars.GIT_CLIENT_GITHUB_CLIENT_ID || secrets.GIT_CLIENT_GITHUB_CLIENT_ID }}
          GIT_CLIENT_GITLAB_CLIENT_ID: ${{ vars.GIT_CLIENT_GITLAB_CLIENT_ID || secrets.GIT_CLIENT_GITLAB_CLIENT_ID }}
        with:
          projectPath: git-client
          tagName: ${{ env.TAG }}
          releaseName: "Merathon ${{ env.TAG }}"
          # Paquets ajoutés au brouillon créé par le job « Version et tag » (notes comprises).
          releaseDraft: true
          # latest.json (manifeste des mises à jour automatiques) est écrit par le job de publication :
          # ici, les jobs Linux et Windows le complèteraient en parallèle et le dernier écraserait l'autre.
          includeUpdaterJson: false
          prerelease: false
          args: --bundles ${{ matrix.targets }}

  publish:
    name: Publication de la release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Télécharger les paquets
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          # En cas de relance : fichiers régénérés ci-dessous.
          rm -f assets/SHA256SUMS.txt assets/latest.json

      # Manifeste des mises à jour automatiques, d'après les signatures de tous les paquets.
      # Entrées génériques : AppImage sous Linux, installateur NSIS sous Windows.
      - name: Manifeste des mises à jour (latest.json)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          platforms='{}'
          add() { # add <plateforme> <fichier> : échoue si le paquet ou sa signature manque
            [ -f "assets/$2" ] && [ -f "assets/$2.sig" ] || { echo "::error::Paquet ou signature manquant : $2"; exit 1; }
            platforms="$(jq --arg p "$1" --arg url "$BASE/$2" --rawfile sig "assets/$2.sig" \
              '.[$p] = {signature: $sig, url: $url}' <<< "$platforms")"
          }
          add linux-x86_64          "Merathon_${VERSION}_amd64.AppImage"
          add linux-x86_64-appimage "Merathon_${VERSION}_amd64.AppImage"
          add linux-x86_64-deb      "Merathon_${VERSION}_amd64.deb"
          add windows-x86_64        "Merathon_${VERSION}_x64-setup.exe"
          add windows-x86_64-nsis   "Merathon_${VERSION}_x64-setup.exe"
          add windows-x86_64-msi    "Merathon_${VERSION}_x64_en-US.msi"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          jq -n --arg version "$VERSION" --rawfile notes notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date, platforms: $platforms}' > assets/latest.json
          cat assets/latest.json
          gh release upload "$TAG" assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber

      # Empreintes de tous les paquets, pour que les utilisateurs puissent vérifier leurs téléchargements.
      - name: Empreintes SHA-256
        run: |
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publier la release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Release $TAG publiée : https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
