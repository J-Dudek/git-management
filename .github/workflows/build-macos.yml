# Paquet macOS universel (Apple Silicon + Intel), appelé par release.yml (job « Paquet macOS »).
#
# Comme pour Linux et Windows, le paquet est généré avant tout commit de version, à partir du même contenu
# (version appliquée localement) : release.yml le place dans les `needs` du job de version, donc rien n'est
# tagué ni publié s'il échoue. L'artefact `macos` contient le .dmg, le .app.tar.gz (mises à jour automatiques),
# sa signature .sig et l'empreinte des fichiers versionnés ; release.yml joint les paquets à la release, ajoute
# l'entrée darwin de latest.json et leurs empreintes SHA-256.
#
# Lancement manuel possible pour tester le build seul : rien n'est publié.
name: build-macos

on:
  workflow_call:
    inputs:
      version:
        description: Version à appliquer avant le build (X.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version à appliquer avant le build (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: git-client/package-lock.json

      # Les deux cibles sont nécessaires pour le binaire universel, quel que soit le processeur du runner.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri

      # Empreinte (arbre git) des fichiers versionnés : le job de release la compare à son commit de version,
      # comme pour les paquets Linux et Windows.
      - name: Appliquer la version
        env:
          VERSIONED_FILES: >-
            git-client/package.json git-client/package-lock.json git-client/src-tauri/Cargo.toml
            git-client/src-tauri/Cargo.lock git-client/src-tauri/tauri.conf.json
        run: |
          node git-client/scripts/version.mjs apply "$VERSION"
          git add -- $VERSIONED_FILES
          mkdir -p out
          git write-tree > out/version-tree.txt
          echo "Arbre versionné : $(cat out/version-tree.txt)"

      - name: Installer les dépendances
        working-directory: git-client
        run: npm ci

      - name: Construire
        working-directory: git-client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identifiants client OAuth intégrés au binaire (mêmes variables que les autres plateformes,
          # anciens noms GIT_CLIENT_* compris).
          MERATHON_GITHUB_CLIENT_ID: ${{ vars.MERATHON_GITHUB_CLIENT_ID || secrets.MERATHON_GITHUB_CLIENT_ID || vars.GIT_CLIENT_GITHUB_CLIENT_ID || secrets.GIT_CLIENT_GITHUB_CLIENT_ID }}
          MERATHON_GITLAB_CLIENT_ID: ${{ vars.MERATHON_GITLAB_CLIENT_ID || secrets.MERATHON_GITLAB_CLIENT_ID || vars.GIT_CLIENT_GITLAB_CLIENT_ID || secrets.GIT_CLIENT_GITLAB_CLIENT_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      # Noms alignés sur les autres paquets (Merathon_X.Y.Z_…) ; la signature porte sur le contenu,
      # renommer l'archive ne l'invalide pas.
      - name: Rassembler les paquets
        run: |
          bundle=git-client/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/Merathon_${VERSION}_universal.dmg"
          cp "$bundle/macos/Merathon.app.tar.gz" "out/Merathon_${VERSION}_universal.app.tar.gz"
          cp "$bundle/macos/Merathon.app.tar.gz.sig" "out/Merathon_${VERSION}_universal.app.tar.gz.sig"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: out/
          if-no-files-found: error
          retention-days: 7
