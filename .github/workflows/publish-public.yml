name: Publish to public repo

# Copie le contenu d'un tag sur le dépôt public (vitrine) et y pousse le même tag.
# Appelé par le workflow « Release » : un tag poussé par GITHUB_TOKEN ne déclenche aucun workflow,
# un déclenchement « on: push: tags » ne partirait donc pas. Relançable à la main pour un tag existant.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag à publier (ex. v2.0.0)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout (private repo)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Export a clean snapshot
        run: |
          mkdir ../snapshot
          git archive HEAD | tar -x -C ../snapshot
          # Retirer ce qui ne doit pas être public : de .github, seuls les modèles d'issues sont gardés
          find ../snapshot/.github -mindepth 1 -maxdepth 1 ! -name ISSUE_TEMPLATE -exec rm -rf {} +
          rm -rf ../snapshot/docs-internes

      - name: Clone public repo
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:J-Dudek/merathon.git ../public

      - name: Replace content and push
        run: |
          cd ../public
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../snapshot/. .
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Release ${TAG}" || echo "Rien à publier"
          git tag -f "${TAG}"
          git push origin HEAD --tags --force

      # La release (notes, paquets, latest.json) est créée sur ce tag par le workflow « Release ».
