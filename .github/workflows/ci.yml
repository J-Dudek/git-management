name: CI

# Tests des pull requests, sous Linux seulement. Sur main, ils sont lancés par le workflow Release
# (avant toute montée de version), avec Windows en plus : une régression propre à Windows bloque la release.
# Ce dépôt est privé : chaque minute compte (et une minute Windows plus qu'une minute Linux).
on:
  pull_request:
    # Une PR qui ne touche que la documentation ne relance pas la compilation.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_call:
    inputs:
      windows:
        description: Lancer aussi les tests sous Windows
        type: boolean
        default: false

permissions:
  contents: read

# Un nouveau push sur une PR annule les tests du précédent. Les tests d'une release ne sont jamais annulés :
# celle-ci échouerait.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri
          # Cache enregistré seulement sur main (via le workflow Release) : les branches et les PR le lisent
          # sans écrire le leur (~1,5 Go chacun). Sinon le quota de 10 Go déborde et GitHub évince
          # les caches des paquets de release, alors recompilés de zéro.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libgit2-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            openssh-server

      - name: Rust lint
        working-directory: git-client/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: git-client/src-tauri
        # Sous Linux, les tests du SSH Android (src/test_sshd.rs) doivent trouver sshd : ils échouent au lieu d'être passés.
        env:
          MERATHON_REQUIRE_SSHD: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: cargo test

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: git-client/package-lock.json

      - name: Install frontend deps
        working-directory: git-client
        run: npm ci

      - name: TypeScript check
        working-directory: git-client
        run: npx tsc --noEmit

      # Règles TypeScript, SonarJS et hooks React (indépendant de l'OS : lancé une seule fois).
      - name: Lint (ESLint + SonarJS)
        if: matrix.os == 'ubuntu-latest'
        working-directory: git-client
        run: npm run lint

      - name: Frontend tests
        working-directory: git-client
        run: npx vitest run

  audit:
    name: Audit de sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Seules les dépendances livrées dans l'application sont auditées (--omit=dev) : l'outillage de lint et de
      # test (ESLint, Vitest…) n'est pas embarqué, et un avis sur ses dépendances ne doit pas bloquer les releases.
      - name: npm audit
        working-directory: git-client
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: git-client/src-tauri
        run: cargo audit

