name: CI

# Tests à chaque push, quelle que soit la branche. Sur main, ils sont lancés par le workflow
# Release (avant toute montée de version) : on ne les lance pas deux fois.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libgit2-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Rust lint
        working-directory: git-client/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: git-client/src-tauri
        run: cargo test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: git-client/package-lock.json

      - name: Install frontend deps
        working-directory: git-client
        run: npm ci

      - name: TypeScript check
        working-directory: git-client
        run: npx tsc --noEmit

      # Règles TypeScript, SonarJS et hooks React (indépendant de l'OS : lancé une seule fois).
      - name: Lint (ESLint + SonarJS)
        if: matrix.os == 'ubuntu-latest'
        working-directory: git-client
        run: npm run lint

      - name: Frontend tests
        working-directory: git-client
        run: npx vitest run

  audit:
    name: Audit de sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit
        working-directory: git-client
        run: npm audit --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: git-client/src-tauri
        run: cargo audit

