name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-client/src-tauri

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libgit2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Rust lint
        working-directory: git-client/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: git-client/src-tauri
        run: cargo test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: git-client/package-lock.json

      - name: Install frontend deps
        working-directory: git-client
        run: npm ci

      - name: TypeScript check
        working-directory: git-client
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: git-client
        run: npx vitest run
